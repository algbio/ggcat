[package]
name = "ggcat_kmers_transform"
version = "2.2.0"
edition = "2024"
[dependencies]

# Config
config = { package = "ggcat_config", path = "../config" }
utils = { package = "ggcat_utils", path = "../utils" }

# Common libraries
parallel-processor = "0.3.2"
streaming-libdeflate-rs = "0.3.0"
nightly-quirks = "0.1.5"
hashes = { package = "ggcat_hashes", path = "../hashes" }
minimizer_bucketing = { package = "ggcat_minimizer_bucketing", path = "../minimizer_bucketing" }
colors = { package = "ggcat_colors", path = "../colors" }
structs = { package = "ggcat_structs", path = "../structs" }

# Other libraries
io = { package = "ggcat_io", path = "../io" }
parking_lot = "0.12.5"
replace_with = "0.1.8"
tokio = "1.54.0"


# Tracing
instrumenter = "0.1.4"
ggcat-logging = { version = "2.2.0", path = "../logging" }
typenum = "1.20.1"
