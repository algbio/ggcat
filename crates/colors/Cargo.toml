[package]
name = "ggcat_colors"
version = "2.2.0"
edition = "2024"
[dependencies]

# Config
config = { package = "ggcat_config", path = "../config" }

# Static dispatch
dynamic-dispatch = "0.5.6"

# Common libraries
parallel-processor = "0.3.2"
streaming-libdeflate-rs = "0.3.1"
nightly-quirks = "0.1.5"

# Common pipeline libraries
hashes = { package = "ggcat_hashes", path = "../hashes" }
io = { package = "ggcat_io", path = "../io" }
structs = { package = "ggcat_structs", path = "../structs" }
utils = { package = "ggcat_utils", path = "../utils" }

# Other libraries
hashbrown = "0.15.5"
dashmap = "6.2.1"
byteorder = "1.5.0"
siphasher = "1.0.4"
desse = "0.2.1"
replace_with = "0.1.8"
bstr = "1.13.1"
atoi = "2.0.0"
crossbeam = "0.8.5"
rayon = "1.12.0"
rand = "0.8.8"
roaring = "0.10.12"
parking_lot = "0.12.5"
serde = "1.0.229"
lz4 = "1.28.1"
bincode = "1.3.3"
itertools = "0.13.0"
ggcat-logging = { version = "2.2.0", path = "../logging" }
anyhow = "1.0.104"
rustc-hash = "2.1.3"
typenum = "1.20.1"

[features]
support_kmer_counters = ["io/support_kmer_counters", "structs/support_kmer_counters"]
