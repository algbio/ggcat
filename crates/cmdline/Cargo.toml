[package]
authors = ["Andrea Cracco <guilucand@gmail.com>"]
edition = "2024"
name = "ggcat_cmdline"
version = "2.2.0"

[[bin]]
name = "ggcat"
path = "src/main.rs"

[dependencies]
bincode = "1.3.3"
bstr = "1.13.1"
byteorder = "1.5.0"
itertools = "0.13.0"
lazy_static = "1.5.1"
lz4 = "1.28.1"
zstd = "0.13.3"
rayon = "1.12.0"
serde = "1.0.229"
hashbrown = "0.15.5"
rand = "0.8.8"
libc = "0.2.191"
filebuffer = "1.0.1"
crossbeam = "0.8.5"
fdlimit = "0.3.0"
parking_lot = "0.12.5"
dashmap = "6.2.1"
serde_json = "1.0.154"
ahash = "0.8.12"
siphasher = "1.0.4"
desse = "0.2.1"
replace_with = "0.1.8"
roaring = "0.10.12"
backtrace = "0.3.76"
csv = "1.4.0"
flate2 = { default-features = false, features = [
    "cloudflare_zlib",
], version = "1.1.10" }
fs_extra = "1.3.0"
atoi = "2.0.0"

# Config
config = { package = "ggcat_config", path = "../config" }
utils = { package = "ggcat_utils", path = "../utils" }

# Static dispatch
dynamic-dispatch = "0.5.6"


# Common libraries
parallel-processor = "0.3.2"
io = { package = "ggcat_io", path = "../io" }
colors = { package = "ggcat_colors", path = "../colors" }

assembler = { package = "ggcat_assembler", path = "../assembler" }
instrumenter = "0.1.4"

querier = { package = "ggcat_querier", path = "../querier" }
ggcat-api = { version = "2.2.0", path = "../api", default-features = false }
ggcat-logging = { version = "2.2.0", path = "../logging" }
clap = { version = "4.6.7", features = ["derive"] }


[features]
default = ["full"]
memory-guards = ["parallel-processor/memory-guards"]
mem-analysis = ["parallel-processor/track-usage"]
no-stats = ["parallel-processor/no-stats"]
detailed-stats = ["ggcat-api/detailed-stats"]
process-stats = ["parallel-processor/process-stats"]
tracing = ["instrumenter/enabled"]
kmer-counters = ["assembler/support_kmer_counters"]

# Features used to filter ggcat capabilites
full = [
    "hash-64bit",
    "hash-128bit",
    "hash-rkarp",
    "hash-forward",
    "enable-colors",
    "enable-gfa",
]

hash-16bit = ["assembler/hash-16bit", "querier/hash-16bit", "ggcat-api/hash-16bit"]    # Support 16bit hashing (optimization for k <= 8)
hash-32bit = ["assembler/hash-32bit", "querier/hash-32bit", "ggcat-api/hash-32bit"]    # Support 32bit hashing (optimization for k <= 16)
hash-64bit = ["assembler/hash-64bit", "querier/hash-64bit", "ggcat-api/hash-64bit"]    # Support 64bit hashing (optimization for k <= 32)
hash-128bit = ["assembler/hash-128bit", "querier/hash-128bit", "ggcat-api/hash-128bit"]   # Support 128bit hashing (k <= 64)
hash-rkarp = ["assembler/hash-rkarp", "querier/hash-rkarp", "ggcat-api/hash-rkarp"]    # Support 128bit rabin-karp hashing (k > 64)
hash-forward = ["assembler/hash-forward", "querier/hash-forward", "ggcat-api/hash-forward"]  # Support non-canonical hashing
enable-colors = ["assembler/enable-colors", "querier/enable-colors", "ggcat-api/enable-colors"] # Support colors
enable-gfa = ["assembler/enable-gfa", "querier/enable-gfa", "ggcat-api/enable-gfa"]    # Support gfa output


[build-dependencies]
make-cmd = "0.1.0"

[dev-dependencies]
hashes = { package = "ggcat_hashes", path = "../hashes" }
